[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-change-tool"
version = "0.1.8"
description = "Local-first aerial image change review desktop application"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6==6.10.1", "SQLAlchemy>=2.0,<2.1", "pydantic>=2.10,<3", "openai>=2,<3", "Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.7"]
build = ["pyinstaller>=6,<7"]

[project.gui-scripts]
llm-change-tool = "llm_change_tool.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.setuptools.package-data]
llm_change_tool = ["resources/**/*.json", "resources/**/*.txt", "resources/**/*.svg"]
